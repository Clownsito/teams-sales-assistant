name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck (sin emitir)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build de producción
        run: npm run build

      - name: Tests
        run: npm test
